version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  production:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: production
    ports:
      - "8080:80"
    volumes:
      - dist:/usr/share/nginx/html:ro
    depends_on:
      - web

volumes:
  dist:
